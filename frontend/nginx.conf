server {
    listen 80;

    # Serve the React SPA
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI service
    # Re-resolve the app container's address (it changes whenever the container is recreated),
    # instead of caching the IP from when nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $app_upstream  http://app:8000;
        proxy_pass         $app_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
