# Re-resolve the app container's address (it changes whenever the container is recreated).
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP: send everyone to HTTPS. The CA certificate stays downloadable over plain HTTP,
# because a device needs it before it can trust the HTTPS site.
server {
    listen 80;

    location = /dam-ca.crt {
        root /usr/share/nginx/public;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="DAM-Local-CA.crt"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/dam-tls/fullchain.crt;
    ssl_certificate_key /etc/dam-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /dam-ca.crt {
        root /usr/share/nginx/public;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="DAM-Local-CA.crt"';
    }

    # Serve the React SPA
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI service
    location /api/ {
        set $app_upstream  http://app:8000;
        proxy_pass         $app_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Uploads arrive in 16 MB chunks; stream them straight through to the app.
        client_max_body_size    80m;
        proxy_request_buffering off;
    }
}
