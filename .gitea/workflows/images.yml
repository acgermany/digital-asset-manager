# Builds the server and frontend images and pushes them to the homelab Nexus registry.
# Runs on the self-hosted Gitea runner only; GitHub ignores .gitea/workflows.
# Tags: <short sha> and <branch> on every push; also :latest on main.
# Deploys to docker.jib after a successful build of main (or of the branch in the repo
# variable DEPLOY_BRANCH), using the repo-scoped host runner labelled dam-deploy.
name: images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: registry.jib

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dam-server
            context: server
          - image: dam-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Build
        run: |
          repo="$REGISTRY/${{ matrix.image }}"
          tags="$repo:${GITHUB_SHA::12} $repo:${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" = main ]; then tags="$tags $repo:latest"; fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          docker build $(printf -- '-t %s ' $tags) \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            ${{ matrix.context }}

      - name: Push
        run: for t in $TAGS; do docker push "$t"; done

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

  deploy:
    needs: build
    # The branch check is a step, not a job-level `if:`: Gitea evaluates job conditions on the
    # server, where `vars` may not resolve, which silently skipped deploys of DEPLOY_BRANCH.
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: dam-deploy
    steps:
      - name: Check deploy branch
        id: gate
        env:
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
        run: |
          want="${DEPLOY_BRANCH:-main}"
          echo "ref: $GITHUB_REF_NAME  deploy branch: $want (DEPLOY_BRANCH='${DEPLOY_BRANCH}')"
          if [ "$GITHUB_REF_NAME" = "$want" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the deploy branch; nothing to do."
          fi

      - name: Fetch deploy files
        if: steps.gate.outputs.deploy == 'true'
        run: |
          rm -rf src
          git -c http.extraHeader="Authorization: token ${{ github.token }}" \
            clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" src

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        run: src/deploy/homelab/deploy.sh "${GITHUB_SHA::12}"
