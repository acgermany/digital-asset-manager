version: '3.8'

services:

  api:
    build: ./api
    container_name: dam-api
    ports:
      - "8000:8000"
    volumes:
      - /Volumes:/scan:ro   # all host-mounted drives, auto-updates as drives connect/disconnect
      - ./data:/data        # SQLite database persistence
    environment:
      - DB_PATH=/data/inventory.db
      - SCAN_PATH=/scan
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dam-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
