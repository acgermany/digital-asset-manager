# Digital Asset Manager
#
# The app only sees host folders that are mounted below. HOST_HOME and HOST_DRIVES
# default to your home folder and /Volumes (macOS). On the Linux box set them in
# .env (e.g. HOST_HOME=/srv, HOST_DRIVES=/media). Everything else (hot folder,
# library, scan sources, network shares, Ollama) is set in the web UI → Configure.

# Shared by the app and the workers: same image, same view of the host, same /data.
x-dam-server: &dam-server
  build: ./server
  image: dam-server:latest
  depends_on:
    db:
      condition: service_healthy
  # SYS_ADMIN lets the app and workers mount SMB/NFS shares added on the Configure page.
  cap_add:
    - SYS_ADMIN
    - DAC_READ_SEARCH
  security_opt:
    - apparmor:unconfined
  restart: unless-stopped

x-dam-env: &dam-env
  DATABASE_URL: postgresql+psycopg://dam:${DB_PASSWORD:-dam}@db:5432/dam
  # Label|path in container|path on host  (the UI shows host paths)
  HOST_ROOTS: "Home|/host/home|${HOST_HOME:-${HOME}};Drives|/host/drives|${HOST_DRIVES:-/Volumes}"
  DATA_DIR: /data
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
  TRANSCRIBE_URL: ${TRANSCRIBE_URL:-http://host.docker.internal:8178}

x-dam-volumes: &dam-volumes
  - ${HOST_HOME:-${HOME}}:/host/home
  # On Linux, add `:rslave` so drives plugged in later show up without a restart.
  - ${HOST_DRIVES:-/Volumes}:/host/drives
  - ./data:/data

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: dam-db
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dam}
      POSTGRES_DB: dam
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=128MB
               -c effective_cache_size=1GB -c max_connections=200
    volumes:
      - dam-pgdata:/var/lib/postgresql/data
    # Localhost only by default. To let workers on other machines connect, set
    # DB_PUBLISH=0.0.0.0:5432 and a real DB_PASSWORD in .env (LAN only — never port-forward).
    ports:
      - "${DB_PUBLISH:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam -d dam"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  app:
    <<: *dam-server
    container_name: dam-app
    # API for local debugging only; the web UI (frontend) proxies /api for everyone else.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *dam-env
      # Jobs run by the worker inside the app container (0 = leave all work to worker containers)
      EMBEDDED_WORKER_CONCURRENCY: ${EMBEDDED_WORKER_CONCURRENCY:-2}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    volumes: *dam-volumes
    mem_limit: 2g

  # Extra queue consumers. None run by default; scale out with:
  #   docker compose up -d --scale worker=3
  # Which queues and how many jobs at once can also be changed live in the app
  # (Workflows → Queues). Workers on other machines: see docker-compose.worker.yml.
  worker:
    <<: *dam-server
    command: ["python", "-m", "dam.worker"]
    environment:
      <<: *dam-env
      WORKER_QUEUES: ${WORKER_QUEUES:-ingest,render,embed,vision,speech}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes: *dam-volumes
    deploy:
      replicas: ${WORKER_REPLICAS:-0}
    stop_grace_period: 40s
    mem_limit: 1536m

  frontend:
    build: ./frontend
    container_name: dam-frontend
    # WEB_BIND=0.0.0.0 shares the web UI on your local network (login required);
    # 127.0.0.1 keeps it on this machine only. localhost:3000 always works on this machine.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
      - "127.0.0.1:3000:80"
    depends_on:
      - app
    mem_limit: 64m
    restart: unless-stopped

  # Bonjour/mDNS so other devices find the app at http://dam.local (Linux hosts only:
  # needs host networking). Enable with: docker compose --profile mdns up -d
  # On macOS use `dns-sd` on the host instead (see README).
  mdns:
    image: dam-server:latest
    command: ["python", "-m", "dam.mdns"]
    network_mode: host
    profiles: ["mdns"]
    environment:
      MDNS_NAME: ${MDNS_NAME:-dam}
      WEB_PORT: ${WEB_PORT:-3000}
    restart: unless-stopped
    mem_limit: 64m

volumes:
  dam-pgdata:
